name: Publish

# Publishes to npm when the version in package.json changes on main. Bump the
# version in a normal commit or pull request; merging it is the release.
#
# Authentication is npm trusted publishing (OIDC), so there is no NPM_TOKEN to
# rotate or leak. It needs configuring once on npmjs.com, under the package's
# Settings -> Trusted Publisher: a GitHub Actions publisher for this repository
# with workflow "publish.yml" and no environment. npm matches that triple
# exactly against the run, so renaming or moving this file stops publishing
# with an E404 that reads as if the package were missing.
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

# Two bumps landing close together must not publish concurrently, and a queued
# run must not be cancelled: each one is a distinct version worth publishing.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.probe.outputs.version }}
      publish: ${{ steps.probe.outputs.publish }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # The registry, not the diff, decides. That keeps re-runs and manual
      # dispatches idempotent, and makes a push that touches package.json
      # without moving the version a no-op rather than a failed publish.
      - name: Look For An Unpublished Version
        id: probe
        run: |
          set -euo pipefail
          name=$(npm pkg get name | tr -d '"')
          version=$(npm pkg get version | tr -d '"')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # `npm view` exits non-zero both for an unpublished version and for a
          # package that has never been published, so test the output instead.
          published=$(npm view "$name@$version" version 2>/dev/null || true)
          if [ -n "$published" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already on npm. Nothing to publish." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Publishing $name@$version." >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      # Pushes the v<version> tag and opens the matching GitHub release.
      contents: write
      # Mints the OIDC token npm trades for a short-lived publish credential,
      # and signs the provenance attestation.
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # v7 is the first setup-node that leaves OIDC alone: earlier versions
      # write a placeholder _authToken into .npmrc whenever registry-url is
      # set, which npm reads as "auth is configured" and never starts the token
      # exchange, failing with ENEEDAUTH.
      - name: Set Up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # A poisoned dependency cache would run attacker code in the job
          # holding the OIDC token, and this package has one small dev
          # dependency, so the cache buys nothing worth that.
          package-manager-cache: false

      # Node 24 bundles an npm new enough, but which patch carries which npm
      # shifts over time and publishing cannot be undone, so pin the floor.
      - name: Ensure npm Supports Trusted Publishing
        run: npm install --global npm@^11.5.1

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Check The Tarball Is Complete
        run: node scripts/check-package.mjs

      # No NODE_AUTH_TOKEN: npm exchanges the Actions OIDC token for a
      # short-lived credential by itself, and attaches provenance without
      # being asked, so --provenance is redundant here too.
      - name: Publish To npm
        run: npm publish --access public

      # Nothing else tags now that a release no longer drives the publish, so
      # the tag follows the publish rather than the other way around.
      - name: Tag The Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "Release v$VERSION already exists. Leaving it alone."
            exit 0
          fi
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes
