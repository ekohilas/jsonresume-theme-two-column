name: Publish

# Publishes to npm when the version in package.json changes on main. Bump the
# version in a normal commit or pull request; merging it is the release. Set the
# NPM_TOKEN secret to an npm automation token with publish rights.
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

# Two bumps landing close together must not publish concurrently, and a queued
# run must not be cancelled: each one is a distinct version worth publishing.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.probe.outputs.version }}
      publish: ${{ steps.probe.outputs.publish }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # The registry, not the diff, decides. That keeps re-runs and manual
      # dispatches idempotent, and makes a push that touches package.json
      # without moving the version a no-op rather than a failed publish.
      - name: Look For An Unpublished Version
        id: probe
        run: |
          set -euo pipefail
          name=$(npm pkg get name | tr -d '"')
          version=$(npm pkg get version | tr -d '"')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # `npm view` exits non-zero both for an unpublished version and for a
          # package that has never been published, so test the output instead.
          published=$(npm view "$name@$version" version 2>/dev/null || true)
          if [ -n "$published" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already on npm. Nothing to publish." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Publishing $name@$version." >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      # Pushes the v<version> tag and opens the matching GitHub release.
      contents: write
      # Lets npm attach a provenance attestation to the published tarball.
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Check The Tarball Is Complete
        run: node scripts/check-package.mjs

      - name: Publish To npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Nothing else tags now that a release no longer drives the publish, so
      # the tag follows the publish rather than the other way around.
      - name: Tag The Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "Release v$VERSION already exists. Leaving it alone."
            exit 0
          fi
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes
